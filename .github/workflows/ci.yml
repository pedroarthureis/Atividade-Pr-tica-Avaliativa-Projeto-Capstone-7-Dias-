name: CI - Pipeline de Integração Contínua & Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Análise Estática & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar ESLint (Linter Gate)
        run: npm run lint

  test-and-coverage:
    name: Testes Multinível & Coverage Gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Testes Unitários (Lógica Pura - TDD)
        run: npm run test:unit

      - name: Executar Testes de Integração (Doubles & DB em Memória)
        run: npm run test:integration

      - name: Executar Testes End-to-End (E2E / Supertest)
        run: npm run test:e2e

      - name: Executar Auditoria de Cobertura de Código (Coverage Gate)
        run: npm run test:coverage | tee test-coverage.log

      - name: Publicar Relatório de Cobertura como Artefato de Build
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14

      - name: Publicar Logs de Execução dos Testes como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-logs
          path: test-coverage.log
          retention-days: 14

  load-test:
    name: Teste de Desempenho & Concorrência
    runs-on: ubuntu-latest
    needs: test-and-coverage
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Teste de Carga Concorrente (50 VUs)
        run: npm run test:load

      - name: Publicar Métricas de Carga como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: load-test-metrics
          path: load-test-results.json
          retention-days: 14
